name: build-tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos (official installer)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl xz-utils make git libtinfo5 libncurses5 fakeroot
          export THEOS=$GITHUB_WORKSPACE/theos
          export CI=1
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "--- toolchain ---"
          ls $THEOS/toolchain 2>/dev/null || echo "no toolchain dir"
          ls $THEOS/sdks 2>/dev/null | head

      - name: Embed lineups.json
        run: python3 tools/embed_lineups.py

      - name: Build
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          export PATH=$THEOS/bin:$PATH
          set -o pipefail
          make package FINALPACKAGE=1 DEBUG=0 2>&1 | tail -40
          echo "--- packages ---"
          ls -l packages || true
          find .theos -name "*.dylib" 2>/dev/null | head

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TFTAssist-build
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib
          if-no-files-found: warn