name: build-tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl xz-utils libtinfo5 clang dpkg fakeroot

      - name: theos
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar xz -C $THEOS/sdks --strip-components=1
          curl -L -o $THEOS/bin/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x $THEOS/bin/ldid
          ls $THEOS/sdks | head

      - name: build
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          make package FINALPACKAGE=1 DEBUG=0 V=1 || make package FINALPACKAGE=1 DEBUG=0
          echo "--- output ---"
          ls -l packages || true
          find .theos -name "*.dylib" | head

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: TFTAssist-build
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib
          if-no-files-found: warn